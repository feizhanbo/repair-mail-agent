name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Verify backend and migration graph
        working-directory: backend
        env:
          APP_ENV: test
          AIRMA_WORKER_ENVIRONMENT: test
        run: |
          python -m alembic heads
          python -m pytest -q
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Validate single-worker Compose model
        env:
          APP_ENV: test
          MYSQL_ROOT_PASSWORD: ci-only
        run: |
          cp .env.example .env
          docker compose config --quiet
