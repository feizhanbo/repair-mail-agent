upstream repair_frontend {
    server frontend:80;
}

upstream repair_backend {
    server backend-api:8000;
}

log_format main_json escape=json
    '{'
    '"timestamp":"$time_iso8601",'
    '"request_id":"req_$request_id",'
    '"remote_addr":"$remote_addr",'
    '"real_ip":"$remote_addr",'
    '"x_forwarded_for":"$http_x_forwarded_for",'
    '"method":"$request_method",'
    '"uri":"$uri",'
    '"http_version":"$server_protocol",'
    '"status":$status,'
    '"body_bytes_sent":$body_bytes_sent,'
    '"request_time":$request_time,'
    '"upstream_response_time":"$upstream_response_time",'
    '"upstream_connect_time":"$upstream_connect_time",'
    '"upstream_header_time":"$upstream_header_time",'
    '"upstream_addr":"$upstream_addr",'
    '"user_agent":"$http_user_agent"'
    '}';

server {
    listen 80;
    server_name _;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    client_max_body_size 512m;
    access_log /dev/stdout main_json;
    error_log /dev/stderr warn;

    location ~ ^/(health|readiness)$ {
        proxy_pass http://repair_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID req_$request_id;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://repair_backend/api/;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID req_$request_id;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://repair_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID req_$request_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
