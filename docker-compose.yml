services:
  mysql:
    image: mysql:8.0
    container_name: repair-mysql
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-repair_system_dev}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - repair_net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\""]
      interval: 10s
      timeout: 5s
      retries: 10

  langgraph-postgres:
    image: postgres:16-alpine
    profiles:
      - langgraph
    container_name: repair-langgraph-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${LANGGRAPH_POSTGRES_DB:-repair_langgraph}
      POSTGRES_USER: ${LANGGRAPH_POSTGRES_USER:-repair_langgraph}
      # Local/default legacy deployments remain bootable before operators add
      # Graph secrets. Production Graph mode rejects this development default.
      POSTGRES_PASSWORD: ${LANGGRAPH_POSTGRES_PASSWORD:-change-me-langgraph}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - langgraph_postgres_data:/var/lib/postgresql/data
    networks:
      - repair_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend-api:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: repair-backend-api
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
    expose:
      - "8000"
    environment:
      AI_LOG_DIR: /app/logs/ai
      APP_RELEASE_COMMIT: ${APP_RELEASE_COMMIT:-}
    volumes:
      - ai_log_data:/app/logs/ai
      - ./release-evidence:/app/release-evidence:ro
    networks:
      - repair_net

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: repair-frontend
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - repair_net

  nginx:
    image: nginx:stable-alpine
    container_name: repair-nginx
    restart: unless-stopped
    depends_on:
      - backend-api
      - frontend
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - repair_net

volumes:
  mysql_data:
  langgraph_postgres_data:
  ai_log_data:

networks:
  repair_net:
    driver: bridge
