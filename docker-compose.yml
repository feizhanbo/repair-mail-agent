services:
  mysql:
    image: mysql:8.0
    container_name: repair-mysql
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-repair_system_dev}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    ports:
      - "127.0.0.1:3307:3306"
      - "127.0.0.1:13307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - repair_net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\""]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: &default-logging
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  backend-api:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: repair-backend-api
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
    expose:
      - "8000"
    environment:
      AI_LOG_DIR: /app/logs/ai
      LOG_DIR: /app/logs/runtime
      LOG_FILE_ENABLED: "true"
      TRUSTED_PROXY_CIDRS: '["172.16.0.0/12"]'
    volumes:
      - ./logs:/app/logs
    networks:
      - repair_net
    logging: *default-logging
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  mail-worker:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: repair-mail-worker
    restart: unless-stopped
    command: ["python", "-m", "app.mail_worker"]
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      AI_LOG_DIR: /app/logs/ai
      LOG_DIR: /app/logs/runtime
      LOG_FILE_ENABLED: "true"
      MAIL_WORKER_ENABLED: "true"
      MAIL_SCHEDULER_IN_API: "false"
    volumes:
      - ./logs:/app/logs
    networks:
      - repair_net
    logging: *default-logging

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: repair-frontend
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - repair_net
    logging: *default-logging

  nginx:
    image: nginx:stable-alpine
    container_name: repair-nginx
    restart: unless-stopped
    depends_on:
      - backend-api
      - frontend
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - repair_net
    logging: *default-logging

volumes:
  mysql_data:

networks:
  repair_net:
    driver: bridge
