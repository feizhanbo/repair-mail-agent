profiles:
  qwen:
    api_key_setting: QWEN_API_KEY
    base_url_setting: QWEN_BASE_URL

tasks:
  mail_classification:
    primary: {profile: qwen, model: qwen3.7-plus}
    fallback: {profile: qwen, model: qwen3.8-flash}
    temperature: 0.0
    timeout_seconds: 30
    max_retries: 2
    max_output_tokens: 4096
    requires_json: true
    requires_vision: false
    structured_output_method: json_schema
  mail_classification_visual:
    primary: {profile: qwen, model: qwen-vl-plus}
    temperature: 0.0
    timeout_seconds: 45
    max_retries: 2
    max_output_tokens: 4096
    requires_json: true
    requires_vision: true
    structured_output_method: json_mode
  repair_field_extract:
    primary: {profile: qwen, model: qwen3.7-plus}
    fallback: {profile: qwen, model: qwen3.8-flash}
    temperature: 0.0
    timeout_seconds: 120
    max_retries: 2
    max_output_tokens: 8192
    requires_json: true
    requires_vision: false
    structured_output_method: json_schema
  reply_draft:
    primary: {profile: qwen, model: qwen3.7-plus}
    fallback: {profile: qwen, model: qwen3.8-flash}
    temperature: 0.1
    timeout_seconds: 30
    max_retries: 2
    max_output_tokens: 4096
    requires_json: true
    requires_vision: false
    structured_output_method: json_schema
  attachment_text_parse:
    primary: {profile: qwen, model: qwen3.7-plus}
    fallback: {profile: qwen, model: qwen3.8-flash}
    temperature: 0.0
    timeout_seconds: 30
    max_retries: 2
    max_output_tokens: 8192
    requires_json: true
    requires_vision: false
    structured_output_method: json_schema
  attachment_visual_parse:
    primary: {profile: qwen, model: qwen-vl-plus}
    temperature: 0.0
    timeout_seconds: 45
    max_retries: 2
    max_output_tokens: 8192
    requires_json: true
    requires_vision: true
    structured_output_method: json_mode
